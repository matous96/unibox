# Katalog aplikací a web zdarma na GitHub Pages:
#   https://hubget.eu/              – web HubGetu (složka website/)
#   https://hubget.eu/catalog.json  – katalog aplikací
# (vlastní doména v Settings → Pages; matous96.github.io/unibox na ni přesměruje)
# Katalog denně vygeneruje data pipeline. Odtud si ho stahují nainstalované HubGet
# (výchozí VITE_CATALOG_URL v sestavené aplikaci) a přibalí ho workflow Vydání.
# Změna webu v main se zveřejní hned – s posledním zveřejněným katalogem, bez pipeline.
#
# Pages posílá katalog komprimovaný (16 MB → ~3,5 MB) s ETagem, takže opakované
# stažení beze změny je jen krátká odpověď 304. Mezipaměť pipeline (stažené zdroje,
# rozměry ikon, ikony webů, „první výskyt“ aplikací) se drží v mezipaměti Actions –
# první běh trvá kolem 45 minut (hlavně ikony z webů aplikací), další pár minut.
#
# Nastavení (jednou): Settings → Pages → Build and deployment → Source: GitHub Actions.
# Spustit jde i ručně: Actions → Katalog → Run workflow (vždy s novým katalogem).

name: Katalog
run-name: "${{ github.event_name == 'schedule' && 'Katalog – denní aktualizace' || github.event_name == 'push' && 'Web – aktualizace' || 'Katalog – ruční spuštění' }}"

on:
  schedule:
    - cron: "23 2 * * *" # každý den
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/catalog.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Sestavení katalogu a webu
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAGES_CATALOG_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/catalog.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Pipeline potřebuje node:sqlite a spouštění TypeScriptu bez sestavení (Node 24)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Jen změna webu: zveřejněný katalog beze změny (Pages nasazuje vždy celý web i s katalogem)
      - name: Katalog z GitHub Pages
        id: published
        if: github.event_name == 'push'
        run: |
          mkdir -p data-pipeline/out
          if curl -fsSL --compressed --retry 3 "$PAGES_CATALOG_URL" -o data-pipeline/out/catalog.json \
            && node scripts/check-catalog.mjs data-pipeline/out/catalog.json; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Zveřejněný katalog nejde použít – vygeneruje se nový"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.published.outputs.reused != 'true'

      # Každý běh uloží novou mezipaměť a další začne od poslední (staré GitHub sám maže)
      - name: Mezipaměť pipeline
        if: steps.published.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: data-pipeline/.cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - name: Data pipeline
        if: steps.published.outputs.reused != 'true'
        env:
          # Hvězdičky repozitářů z GraphQL API GitHubu (veřejná data, žádná oprávnění navíc)
          GITHUB_TOKEN: ${{ github.token }}
        run: node data-pipeline/src/index.ts

      # Rozbitý nebo neúplný katalog se nezveřejní – aplikace by ho stáhla všem
      - name: Kontrola katalogu
        run: node scripts/check-catalog.mjs data-pipeline/out/catalog.json

      # Web je čisté HTML/CSS/JS s relativními odkazy – zveřejní se tak, jak je v repozitáři
      - name: Obsah webu
        run: |
          mkdir -p _site
          cp -R website/. _site/
          rm -f _site/vite.config.mjs
          cp data-pipeline/out/catalog.json _site/catalog.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Zveřejnění na GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
