<!--
  Ikona testovací verze Uniboxu pro oznamovací oblast – tmavá varianta (světlý hlavní panel):
  stejná kresba jako tray-icon-dark.svg, jen krabice je plná a je v ní vyříznutý nápis „test“,
  aby šla odlišit od nainstalovaného Uniboxu, který běží vedle. Tečku stavu kreslí tray.rs
  vpravo nahoře (vpravo dole by zakryla nápis).
  PNG:  pnpm tauri icon assets/tray-icon-test-dark.svg -o <složka> -p 64  → 64x64.png do src-tauri/icons/tray-test-dark.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 32 32">
  <defs>
  <mask id="m">
  <rect width="32" height="32" fill="#fff"/>
  <text x="16" y="27.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="-0.3" fill="#000">test</text>
  </mask>
  </defs>
  <g fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <path d="M5.5 17 L2 12 H13.5 L16 17"/>
  <path d="M26.5 17 L30 12 H18.5 L16 17"/>
  </g>
  <rect x="4" y="15.5" width="24" height="15" rx="3.5" fill="#1c1c1c" mask="url(#m)"/>
  <g fill="#1c1c1c">
  <rect x="5.75" y="3.25" width="5.5" height="5.5" rx="1.5" transform="rotate(-15 8.5 6)"/>
  <rect x="13.25" y="1" width="5.5" height="5.5" rx="1.5"/>
  <rect x="20.75" y="3.25" width="5.5" height="5.5" rx="1.5" transform="rotate(15 23.5 6)"/>
  </g>
</svg>
